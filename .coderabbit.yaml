# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews pull requests from people. The open-source tier is free for public
# repositories. Below 10 stars it only reviews when asked: comment `@coderabbitai review`.
#
# Dependabot PRs are skipped: they are gated by the full `checks` workflow and merged by its
# `dependabot-automerge` job, so an AI review there would add noise and no safety.
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [".*"]
    ignore_usernames: ["dependabot[bot]"]
  path_filters:
    - "!**/payload-manifest.json"
    - "!package-lock.json"
    - "!CHANGELOG.md"
  path_instructions:
    - path: "skills/l3io-*/**"
      instructions: >-
        Files under skills/<skill>/ that also exist under skills/_shared/ are GENERATED by
        `npm run sync:scripts` and must never be edited directly. Flag any change to such a
        copy that has no matching change in skills/_shared/. Also flag a skill payload change
        with no regenerated payload-manifest.json in the same PR.
    - path: "skills/_shared/pm_status/**/*.py"
      instructions: >-
        Every .py in this package is capped at 1,500 lines; the remedy for hitting it is
        splitting a module, never raising the cap. Only pm-status resolves a node key to a
        state path; flag any path assembly elsewhere. `cost` is always derived from tokens
        x rates, never entered.
    - path: "skills/**/*.md"
      instructions: >-
        Probes for an installed skill must cover .claude/skills, .agents/skills and BMad's
        install record _bmad/_config/skill-manifest.csv (checks 29, 37 and 38). l3io 3.x on
        main supports BMad 6.x only; v7-specific behaviour belongs on the v7 branch.
    - path: ".github/workflows/**"
      instructions: >-
        Pin actions/* by a maintained major tag, everything else by an exact release tag or
        a SHA, never a branch. Keep workflow permissions least-privilege (contents: read by
        default, write only on the job that needs it). Any gate step must run after `npm ci`.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "scripts/CLAUDE.md"
      - "CONTRIBUTING.md"
chat:
  auto_reply: true
