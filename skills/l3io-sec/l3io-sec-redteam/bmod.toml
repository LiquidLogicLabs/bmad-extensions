[bmod]
code = "l3io-sec"
version = "3.7.1"
update_source = "github:LiquidLogicLabs/bmad-extensions/skills/l3io-sec"
required_skills = [
  { skill = "bmad", version = "6.13.0", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
]
pre_install_message = ""
post_install_message = """l3io-sec is installed.
Run /l3io-doctor wire to add the five threat lenses and the AI-poisoning lens to bmad-review and every thorough code review.
Use /l3io-sec-redteam for a full red team session at epic or solution scope. The agent builds its research cache over time for faster platform best practices lookups.
Ensure WebSearch is enabled in your agent's permissions for live platform research."""

[[bmod.config_questions]]
key = "research_cache_ttl_days"
scope = "user"
prompt = "How many days before platform best practices cache entries are refreshed?"
default = "30"

[skill]
scripts = [
  "scripts/lenses/l3io-ai-poisoning.md",
  "scripts/lenses/l3io-threat-abuse.md",
  "scripts/lenses/l3io-threat-chaos.md",
  "scripts/lenses/l3io-threat-design.md",
  "scripts/lenses/l3io-threat-external.md",
  "scripts/lenses/l3io-threat-insider.md",
]
