# --------------------------------------------------------------------------------------------
# l3io-arch-review joins bmad-architecture (spec §14.3). Its three surfaces are lists that
# append (customize.toml:62-99), so none can collide with a team's own value. The design review
# is a `file:` finalize reviewer (:90-93): it runs at every Reviewer Gate, Finalize, Validate
# and headless alike (references/reviewer-gate.md:7, headless.md:5), which makes it the epic
# architecture gate 3.x ran inside l3io-execute. The standards are consulted on demand as an
# external source (:66-75), and the documentation standard is applied to fuller prose
# documents only (:54-64).
# --------------------------------------------------------------------------------------------

[[entry]]
id = "l3io-arch-design-review"
skill = "bmad-architecture"
kind = "list"
path = "workflow.finalize_reviewers"
requires = "l3io-arch"
value = "file:{project-root}/_bmad/l3io-arch/scripts/reviewers/epic-design-review.md"

[[entry]]
id = "l3io-arch-standards-source"
skill = "bmad-architecture"
kind = "list"
path = "workflow.external_sources"
requires = "l3io-arch"
value = "When choosing a stack, a dependency, a runtime or base image, a logging approach or a deployment mode, or when drawing a module boundary, consult l3io's engineering standards before recommending: `{project-root}/_bmad/l3io-arch/scripts/standards/standards-core.md`, plus the overlay beside it for each stack in play (`standards-python.md`, `standards-nodejs.md`, `standards-dotnet.md`, `standards-github-actions.md`, `standards-docker.md`, `standards-powershell.md`, `standards-shell.md`). Commit only to what they allow, or record the departure as an AD naming the principle it departs from."

[[entry]]
id = "l3io-arch-doc-standard"
skill = "bmad-architecture"
kind = "list"
path = "workflow.doc_standards"
requires = "l3io-arch"
value = "l3io documentation standard (`{project-root}/_bmad/l3io-arch/scripts/standards/standards-core.md` §10): the document says which axes it serves (architectural, developer, operational, API), carries a context view and a flow diagram wherever a flow is non-trivial, in Mermaid (ASCII only where Mermaid cannot render), leveled C4-style, and names where it sits in the project's documentation."

# --------------------------------------------------------------------------------------------
# The epic-closure spec sync, beside bmad-retrospective's decision records. The retrospective
# proposes decision records and spec reconciliations and writes only the records the user
# approves (references/acceptance-verdict.md:16-25, workflow.md:101), so no hook of ours may
# edit a spec there. This fact steers its records into docs/adr/ and makes an accepted
# departure from an architecture spec an explicit reconciliation item, which the user applies
# through bmad-architecture, where the design review above runs. persistent_facts is a list
# (customize.toml:33), so it composes with the team's own facts and with l3io-epic-close.
# --------------------------------------------------------------------------------------------

[[entry]]
id = "l3io-fact-spec-sync"
skill = "bmad-retrospective"
kind = "list"
path = "workflow.persistent_facts"
requires = "l3io-pm"
value = "file:{project-root}/_bmad/l3io-pm/scripts/facts/spec-sync.md"
