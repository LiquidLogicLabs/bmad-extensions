[bmod]
code = "l3io-util"
version = "3.7.1"
update_source = "github:LiquidLogicLabs/bmad-extensions/skills/l3io-util"
required_skills = [
  { skill = "bmad", version = "6.13.0", source = "github:bmad-code-org/BMAD-METHOD/skills/core-tools" },
]
pre_install_message = ""
post_install_message = """l3io-util is installed.
Run /l3io-doctor for a project health check, or /l3io-doctor stats for the plan-aware progress dashboard.
Run /l3io-doctor once after installing or upgrading, before any epic run: it detects the state layout and sequences every migration you need behind one confirmation.
Requires uv on PATH: the Python helpers run via `uv run`."""

[skill]
scripts = [
  "scripts/pm_status/__init__.py",
  "scripts/pm_status/__main__.py",
  "scripts/pm_status/adr/__init__.py",
  "scripts/pm_status/bracket/__init__.py",
  "scripts/pm_status/core/__init__.py",
  "scripts/pm_status/instructions/__init__.py",
  "scripts/pm_status/metrics/__init__.py",
  "scripts/pm_status/metrics/actuals_usage.py",
  "scripts/pm_status/metrics/calibration.py",
  "scripts/pm_status/metrics/estimates.py",
  "scripts/pm_status/metrics/events.py",
  "scripts/pm_status/metrics/rates.py",
  "scripts/pm_status/metrics/report.py",
  "scripts/pm_status/metrics/spend.py",
  "scripts/pm_status/nodes/__init__.py",
  "scripts/pm_status/sidecar/__init__.py",
  "scripts/pm_status/sidecar/closure.py",
  "scripts/pm_status/sidecar/commit.py",
  "scripts/pm_status/sidecar/estimate.py",
  "scripts/pm_status/sidecar/lanes.py",
  "scripts/pm_status/sidecar/reconcile.py",
  "scripts/pm_status/sidecar/verbs.py",
  "scripts/pm_status/verbs/__init__.py",
]
