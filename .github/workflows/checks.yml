name: checks
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege, per standards-github-actions.md, which this package SHIPS as a review
# checklist item. Nothing here writes: the job checks out, installs, and runs gates. Without
# this block the workflow inherits `default_workflow_permissions`, which is a REPOSITORY
# SETTING -- invisible to the tree and switchable without a diff. It reads `read` today, so
# this changes no behaviour; it removes the dependency on that setting staying read.
permissions:
  contents: read

jobs:
  shared-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - uses: astral-sh/setup-uv@v10.3.3
    # No actions/setup-python step: every Python entry point below is a PEP-723 script
    # invoked through `uv run`, which reads each script's own `requires-python` header and
    # provisions a matching interpreter itself (downloading a managed CPython if the runner's
    # system Python doesn't satisfy it). setup-uv above installs uv; that is the only Python
    # toolchain this workflow needs.
    # Every `npm run check:*` gate below imports from node_modules (the YAML, shell and CSV
    # parsers the checkers use instead of hand-rolled ones), so the install has to come first:
    # a gate that ran before it would fail on ERR_MODULE_NOT_FOUND. See
    # docs/adr/0007-ci-installs-npm-dependencies.md.
    - name: Verify package.json and package-lock.json are in sync
      # This runs BEFORE `npm ci` on purpose. `npm ci` also refuses when the two disagree,
      # but its failure message is a wall of usage output that buries the actual cause,
      # and it's the first step so a red run says nothing about which gate found the drift.
      # `npm ls --package-lock-only` is instantaneous, network-free, and prints a clean
      # "Missing: X from lock file" summary. If the CI-red-for-a-week pattern of 2026-09
      # recurs, this line is the one whose failure names it.
      run: npm ls --package-lock-only --all --depth=0
    - name: Install check-tooling dependencies
      run: npm ci
    # Fails on high/critical only. Both advisories this repo actually hit (brace-expansion,
    # handlebars) were high or critical and both were dev-only transitives of the
    # conventional-changelog tree -- so a dev-only finding DOES fail the build here, which is
    # deliberate: it is how we find out. Moderate and low are excluded because that same
    # legacy subtree generates them steadily, and a gate people learn to ignore is worse than
    # no gate. This step only runs on push/PR; audit.yml carries the scheduled half, which is
    # the one that catches an advisory published in a week with no commits.
    - name: Dependency audit (high and critical)
      run: npm run check:audit
    - name: Verify shared-script payload copies are in sync
      run: npm run check:scripts
    - name: Verify documentation matches the code it describes
      run: npm run check:docs
    - name: check-docs self-tests
      run: npm run test:scripts
    - name: Verify the pm_status package's version tracks its content
      run: npm run check:version
    - name: Verify per-skill payload manifests match the payload
      run: npm run check:manifest
    - name: Verify module structure — one pm_status copy per module, every registered mode in help.md
      run: npm run check:module
    # BMad v7's own manifest validator, validate_manifests.py, over this package's skills. It is
    # never bundled: scripts/fetch-bmad-tool.mjs fetches it at the pinned BMAD-METHOD commit from
    # raw.githubusercontent.com and verifies each file against a SHA-256 recorded in that script,
    # so this step needs network and a tampered fetch fails it. It runs over a view of skills/
    # without _shared/, which the validator would otherwise report as a skill missing bmod.toml.
    - name: BMad v7 manifest validation (validate_manifests.py at the pin)
      run: npm run check:bmod
    # Ruff over every Python file in skills/. The version is PINNED in the npm script, and
    # ruff.toml carries no `select` list on purpose: the rule set is whatever that pinned
    # version enables, so it cannot drift from a hand-kept list, and a bump is a visible diff.
    # This ran nowhere before -- a scanner's ruff arm that shelled to `uv run ruff` failed to
    # spawn here and was swallowed, so a gate was passing over ~12,000 unlinted lines.
    - name: Python lint (ruff)
      run: npm run check:lint:py
    # Scoped type check over pm-status.py: two classes only, not a clean file (mypy reports
    # 65 findings there today). ruff cannot see either -- a @property read as a method is a
    # type error, not a lint, verified on a minimal repro -- and that exact pattern shipped
    # the 3.4.2 reparent-story crash. The second gated class guards the first: the
    # TYPE_CHECKING import this depends on is invisible at runtime, and deleting it would
    # turn the check into a no-op that still reports success.
    - name: Type check (scoped — pm_status accessor contracts)
      run: npm run check:types
    # standards-shell.md — a reference this package SHIPS to consumers — requires
    # "ShellCheck clean in CI, not just locally", and the repo shipped shell with no gate.
    # The gate FAILS (exit 2) rather than skipping when shellcheck is absent: a linter that
    # cannot run has told you nothing, and reporting that as a pass is how a scanner gate came
    # to report clean over Python it had never read.
    - name: Shell lint (bash -n + ShellCheck)
      run: npm run check:lint:sh
    # Every Python suite under skills/**/tests/, DISCOVERED FROM DISK. This replaced ten
    # hand-written steps, and the reason is that the hand-written list was wrong: seven
    # suites (test-engine.py, its five reader suites, and test-state-record.py) existed and
    # were never named here, so CI had never once run the tests for the migration engine
    # that deletes a project's source layout. A list cannot notice what is missing from it
    # (CLAUDE.md §4). Each suite carries its own PEP-723 header, so no per-suite flags
    # belong here either.
    - name: Python unit tests (discovered, not enumerated)
      run: npm run test:python

  # Merges a Dependabot patch or minor bump once every gate above has passed. `needs` is the
  # wait: this job does not start unless shared-scripts succeeded, so nothing merges on a red
  # run. Majors are left open for a human. Write permission is granted to this job alone; the
  # workflow default above stays read-only.
  #
  # Scope is the PR's AUTHOR, not github.actor: a human re-running a Dependabot PR's checks
  # becomes the actor, and should still get the merge.
  #
  # It does not wait for reviewdog.yml (detect-secrets), a separate workflow `needs` cannot
  # reach. Dependabot edits only package.json, package-lock.json and workflow `uses:` pins.
  dependabot-automerge:
    needs: shared-scripts
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - id: meta
      uses: dependabot/fetch-metadata@v3.1.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Squash-merge a patch or minor bump
      if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
      run: gh pr merge --squash --delete-branch "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Leave a major bump for review
      if: steps.meta.outputs.update-type == 'version-update:semver-major'
      run: echo "Major version bump — left open for a human to review and merge."
